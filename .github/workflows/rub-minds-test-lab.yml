name: Rub Minds Test Lab

on:
  push:
    paths:
      - "rub-minds-test-lab/**"
      - ".github/workflows/rub-minds-test-lab.yml"
      - ".github/workflows/private-rub-minds-validation.yml"
      - "scripts/check_public_safety.py"
      - "docs/PRIVATE_RUB_MINDS_CI.md"
      - "README.md"
  pull_request:
    paths:
      - "rub-minds-test-lab/**"
      - ".github/workflows/rub-minds-test-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rub-minds-test-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract-tests:
    name: Synthetic acceptance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out test lab
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan public test repository for private material
        run: python3 scripts/check_public_safety.py

      - name: Parse every GitHub Actions workflow YAML file
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").sort.each { |path| YAML.parse_file(path); puts "#{path}: YAML syntax PASS" }'

      - name: Lint every GitHub Actions workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status || {
            echo "::error::Pinned actionlint archive checksum mismatch."
            exit 1
          }
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml

      - name: Check Python syntax
        run: python3 -m compileall -q rub-minds-test-lab/contract_model rub-minds-test-lab/tests

      - name: Run synthetic contract tests
        working-directory: rub-minds-test-lab
        run: python3 -m unittest discover -s tests -v
