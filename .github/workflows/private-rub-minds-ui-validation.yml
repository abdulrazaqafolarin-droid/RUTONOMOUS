name: Private Rub Minds visual polish revalidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-rub-minds-ui-validation.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private production-based UI branch to validate
        required: true
        type: string
        default: feat/rub-minds-uiux-production

permissions:
  contents: read

concurrency:
  group: private-rub-minds-ui-validation
  cancel-in-progress: true

jobs:
  production-ui:
    name: Private UI tests and production build
    if: github.repository == 'abdulrazaqafolarin-droid/RUTONOMOUS' && github.ref == 'refs/heads/main' && github.actor == 'abdulrazaqafolarin-droid'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feat/rub-minds-uiux-production' }}
      RUB_MINDS_READ_TOKEN: ${{ secrets.RUB_MINDS_READ_TOKEN }}
    steps:
      - name: Validate private repository access and selected branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RUB_MINDS_READ_TOKEN" ]; then
            echo "::error::Private read token is not configured."
            exit 2
          fi
          if [ "${#SOURCE_REF}" -gt 120 ] || ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1; then
            echo "::error::Invalid private branch reference."
            exit 2
          fi
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/rm-branch.json" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RUB_MINDS_READ_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/abdulrazaqafolarin-droid/Rub-minds/branches/$SOURCE_REF")"
          if [ "$status" != "200" ] || ! jq -e --arg ref "$SOURCE_REF" '.name == $ref and (.commit.sha | type == "string")' "$RUNNER_TEMP/rm-branch.json" >/dev/null; then
            echo "::error::Private branch could not be verified (HTTP $status)."
            exit 2
          fi
          echo "Private source branch: read-only access verified."

      - name: Checkout private source into disposable runner workspace
        uses: actions/checkout@v4
        with:
          repository: abdulrazaqafolarin-droid/Rub-minds
          ref: ${{ inputs.source_ref || 'feat/rub-minds-uiux-production' }}
          token: ${{ secrets.RUB_MINDS_READ_TOKEN }}
          path: private-rub-minds
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: private-rub-minds/package-lock.json

      - name: Install dependencies without exposing private logs
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/rm-npm-install.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Private UI dependency installation failed; detailed logs are withheld."
            exit "$result"
          fi
          echo "Private UI dependency installation: PASS"

      - name: Run Vitest UI and application regression tests
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/rm-vitest.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Safe UI test failure summary"
            grep -E '^ FAIL |^ ❯ |^ × |^ Test Files|^      Tests ' "$RUNNER_TEMP/rm-vitest.log" | tail -20 | cut -c1-220 || true
            echo "::endgroup::"
            echo "::error::Private UI tests failed; assertion diffs and source output are withheld."
            exit "$result"
          fi
          echo "Private Vitest suite: PASS"

      - name: Runtime regression suite
        id: runtime
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:runtime > "$RUNNER_TEMP/rm-runtime-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Runtime regression suite failed; private logs are withheld."
            exit "$result"
          fi
          echo "Runtime regression suite: PASS"

      - name: Backroom regression suite
        id: backroom
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:backroom > "$RUNNER_TEMP/rm-backroom-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Backroom regression suite failed; private logs are withheld."
            exit "$result"
          fi
          echo "Backroom regression suite: PASS"

      - name: External workspace regression suite
        id: external
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:external-workspaces > "$RUNNER_TEMP/rm-external-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::External workspace regression suite failed; private logs are withheld."
            exit "$result"
          fi
          echo "External workspace regression suite: PASS"

      - name: TypeScript project build
        id: tsc
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npx tsc -b > "$RUNNER_TEMP/rm-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::TypeScript project build failed; private logs are withheld."
            exit "$result"
          fi
          echo "TypeScript project build: PASS"

      - name: Install Chromium for browser acceptance
        id: playwright
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/rm-playwright-install.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Browser test runtime installation failed; private logs are withheld."
            exit "$result"
          fi
          echo "Chromium browser test runtime: PASS"

      - name: Vite production bundle
        id: vite
        continue-on-error: true
        working-directory: private-rub-minds
        env:
          VITE_SUPABASE_URL: https://ui-test.supabase.co
          VITE_SUPABASE_ANON_KEY: ui-test-anon-key-not-for-authentication
        shell: bash
        run: |
          set +e
          npx vite build > "$RUNNER_TEMP/rm-vite.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Vite production bundle failed; private logs are withheld."
            exit "$result"
          fi
          echo "Vite production bundle: PASS"

      - name: Run desktop and mobile browser acceptance
        id: browser
        if: always() && steps.vite.conclusion == 'success' && steps.playwright.conclusion == 'success'
        continue-on-error: true
        working-directory: private-rub-minds
        env:
          RM_BASE_URL: http://127.0.0.1:4173
          RM_SCREENSHOT_DIR: ${{ runner.temp }}/rub-minds-ui-screenshots
          VITE_SUPABASE_URL: https://ui-test.supabase.co
          VITE_SUPABASE_ANON_KEY: ui-test-anon-key-not-for-authentication
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/rm-preview.log" 2>&1 &
          preview_pid=$!
          echo "$preview_pid" > "$RUNNER_TEMP/rm-preview.pid"
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Private UI preview server did not become ready."
            exit 1
          fi
          set +e
          node scripts/ui-redesign.browser-test.mjs > "$RUNNER_TEMP/rm-browser.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Desktop/mobile browser acceptance failed; private logs and screenshots are withheld."
            exit "$result"
          fi
          echo "Desktop and mobile Playwright acceptance: PASS"


      - name: Summarize validation stages without exposing private output
        if: always()
        env:
          RUNTIME_RESULT: ${{ steps.runtime.conclusion }}
          BACKROOM_RESULT: ${{ steps.backroom.conclusion }}
          EXTERNAL_RESULT: ${{ steps.external.conclusion }}
          TSC_RESULT: ${{ steps.tsc.conclusion }}
          VITE_RESULT: ${{ steps.vite.conclusion }}
          PLAYWRIGHT_INSTALL_RESULT: ${{ steps.playwright.conclusion }}
          BROWSER_RESULT: ${{ steps.browser.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Runtime regressions: $RUNTIME_RESULT"
          echo "Backroom regressions: $BACKROOM_RESULT"
          echo "External workspace regressions: $EXTERNAL_RESULT"
          echo "TypeScript project build: $TSC_RESULT"
          echo "Vite production bundle: $VITE_RESULT"
          echo "Chromium setup: $PLAYWRIGHT_INSTALL_RESULT"
          echo "Desktop/mobile browser acceptance: $BROWSER_RESULT"
          if [ "$RUNTIME_RESULT" != "success" ] || [ "$BACKROOM_RESULT" != "success" ] || \
             [ "$EXTERNAL_RESULT" != "success" ] || [ "$TSC_RESULT" != "success" ] || \
             [ "$VITE_RESULT" != "success" ] || [ "$PLAYWRIGHT_INSTALL_RESULT" != "success" ] || \
             [ "$BROWSER_RESULT" != "success" ]; then
            echo "::error::One or more private production-baseline validation stages failed."
            exit 1
          fi
          echo "Private production UI validation: PASS"

      - name: Upload short-lived visual acceptance screenshots
        if: always() && steps.browser.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rub-minds-ui-visual-acceptance
          path: ${{ runner.temp }}/rub-minds-ui-screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Remove private source and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf private-rub-minds
          rm -f "$RUNNER_TEMP/rm-branch.json" "$RUNNER_TEMP/rm-npm-install.log" "$RUNNER_TEMP/rm-vitest.log" "$RUNNER_TEMP/rm-build.log" "$RUNNER_TEMP/rm-prebuild.log" "$RUNNER_TEMP/rm-tsc.log" "$RUNNER_TEMP/rm-vite.log" "$RUNNER_TEMP/rm-runtime-tests.log" "$RUNNER_TEMP/rm-backroom-tests.log" "$RUNNER_TEMP/rm-external-tests.log" "$RUNNER_TEMP/rm-playwright-install.log" "$RUNNER_TEMP/rm-preview.log" "$RUNNER_TEMP/rm-preview.pid" "$RUNNER_TEMP/rm-browser.log" && rm -rf "$RUNNER_TEMP/rub-minds-ui-screenshots"
          echo "Disposable private-source checkout and logs removed."
