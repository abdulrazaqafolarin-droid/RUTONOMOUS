name: Private Rub Minds durable wake gate and production build revalidation # owner-authorized PR revalidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-rub-minds-ui-validation.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/private-rub-minds-ui-validation.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private production-based UI branch to validate
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: private-rub-minds-ui-validation
  cancel-in-progress: true

jobs:
  production-ui:
    name: Private UI tests and production build
    if: github.repository == 'abdulrazaqafolarin-droid/RUTONOMOUS' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && github.actor == 'abdulrazaqafolarin-droid'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      RUB_MINDS_READ_TOKEN: ${{ secrets.RUB_MINDS_READ_TOKEN }}
    steps:
      - name: Validate private repository access and selected branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RUB_MINDS_READ_TOKEN" ]; then
            echo "::error::Private read token is not configured."
            exit 2
          fi
          if [ "${#SOURCE_REF}" -gt 120 ] || ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1; then
            echo "::error::Invalid private branch reference."
            exit 2
          fi
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/rm-branch.json" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RUB_MINDS_READ_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/abdulrazaqafolarin-droid/Rub-minds/branches/$SOURCE_REF")"
          if [ "$status" != "200" ] || ! jq -e --arg ref "$SOURCE_REF" '.name == $ref and (.commit.sha | type == "string")' "$RUNNER_TEMP/rm-branch.json" >/dev/null; then
            echo "::error::Private branch could not be verified (HTTP $status)."
            exit 2
          fi
          echo "Private source branch: read-only access verified."

      - name: Inspect native Rub Minds Actions startup metadata
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/abdulrazaqafolarin-droid/Rub-minds/actions/runs"
          for run_id in 43405733117 43405733098; do
            run_file="$RUNNER_TEMP/rm-actions-run-$run_id.json"
            jobs_file="$RUNNER_TEMP/rm-actions-jobs-$run_id.json"
            run_code="$(curl --silent --show-error --output "$run_file" --write-out '%{http_code}' \\
              --header "Accept: application/vnd.github+json" \\
              --header "Authorization: Bearer $RUB_MINDS_READ_TOKEN" \\
              --header "X-GitHub-Api-Version: 2022-11-28" \\
              "$api/$run_id")" || true
            jobs_code="$(curl --silent --show-error --output "$jobs_file" --write-out '%{http_code}' \\
              --header "Accept: application/vnd.github+json" \\
              --header "Authorization: Bearer $RUB_MINDS_READ_TOKEN" \\
              --header "X-GitHub-Api-Version: 2022-11-28" \\
              "$api/$run_id/jobs?filter=latest")" || true
            echo "Private Rub Minds Actions run $run_id: run metadata HTTP ${run_code:-transport-error}; jobs metadata HTTP ${jobs_code:-transport-error}"
            if [ "$run_code" = "200" ] && jq -e '.id' "$run_file" >/dev/null 2>&1; then
              jq '{id,name,event,status,conclusion,run_attempt,run_started_at,head_branch,head_sha}' "$run_file"
            fi
            if [ "$jobs_code" = "200" ] && jq -e '.jobs' "$jobs_file" >/dev/null 2>&1; then
              jq -r '.jobs[] | "job=\(.name) status=\(.status) conclusion=\(.conclusion // "unknown") runner_id=\(.runner_id // 0) runner_name=\(.runner_name // "none") started_at=\(.started_at // "none") completed_at=\(.completed_at // "none") steps=\((.steps // []) | length)"' "$jobs_file"
            fi
          done
          rm -f "$RUNNER_TEMP"/rm-actions-run-*.json "$RUNNER_TEMP"/rm-actions-jobs-*.json
          echo "Only workflow/job metadata was inspected; no private source logs were requested or printed."

      - name: Checkout private source into disposable runner workspace
        uses: actions/checkout@v4
        with:
          repository: abdulrazaqafolarin-droid/Rub-minds
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.RUB_MINDS_READ_TOKEN }}
          path: private-rub-minds
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: private-rub-minds/package-lock.json

      - name: Install dependencies without exposing private logs
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/rm-npm-install.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Private UI dependency installation failed; detailed logs are withheld."
            exit "$result"
          fi
          echo "Private UI dependency installation: PASS"

      - name: Run Vitest UI and application regression tests
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/rm-vitest.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Safe UI test failure summary"
            grep -E '^ FAIL |^ ❯ |^ × |^ Test Files|^      Tests ' "$RUNNER_TEMP/rm-vitest.log" | tail -20 | cut -c1-220 || true
            echo "::endgroup::"
            echo "::error::Private UI tests failed; assertion diffs and source output are withheld."
            exit "$result"
          fi
          echo "Private Vitest suite: PASS"

      - name: Runtime regression suite
        id: runtime
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:runtime > "$RUNNER_TEMP/rm-runtime-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Failing runtime test identifiers"
            echo "Exit status: $result; diagnostic log bytes: $(wc -c < "$RUNNER_TEMP/rm-runtime-tests.log")"
            grep -E '✖|not ok |# fail [^0]|# cancelled [^0]|ℹ fail [^0]|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE|Error \[' "$RUNNER_TEMP/rm-runtime-tests.log" | tail -25 | cut -c1-220 || true
            grep -E '^(ℹ tests|ℹ pass|ℹ fail|# tests|# pass|# fail)' "$RUNNER_TEMP/rm-runtime-tests.log" | tail -8 | cut -c1-160 || true
            echo "::endgroup::"
            echo "::error::Runtime regression suite failed; detailed logs refeat/rub-minds-uiux-production private."
            exit "$result"
          fi
          echo "Runtime regression suite: PASS"

      - name: Backroom regression suite
        id: backroom
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:backroom > "$RUNNER_TEMP/rm-backroom-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Failing Backroom test identifiers"
            echo "Exit status: $result; diagnostic log bytes: $(wc -c < "$RUNNER_TEMP/rm-backroom-tests.log")"
            grep -E '✖|not ok |# fail [^0]|# cancelled [^0]|ℹ fail [^0]|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE|Error \[' "$RUNNER_TEMP/rm-backroom-tests.log" | tail -25 | cut -c1-220 || true
            grep -E '^(ℹ tests|ℹ pass|ℹ fail|# tests|# pass|# fail)' "$RUNNER_TEMP/rm-backroom-tests.log" | tail -8 | cut -c1-160 || true
            echo "::endgroup::"
            echo "::error::Backroom regression suite failed; detailed logs refeat/rub-minds-uiux-production private."
            exit "$result"
          fi
          echo "Backroom regression suite: PASS"

      - name: External workspace regression suite
        id: external
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npm run test:external-workspaces > "$RUNNER_TEMP/rm-external-tests.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Failing external-workspace test identifiers"
            echo "Exit status: $result; diagnostic log bytes: $(wc -c < "$RUNNER_TEMP/rm-external-tests.log")"
            grep -E '✖|not ok |# fail [^0]|# cancelled [^0]|ℹ fail [^0]|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE|Error \[' "$RUNNER_TEMP/rm-external-tests.log" | tail -25 | cut -c1-220 || true
            grep -E '^(ℹ tests|ℹ pass|ℹ fail|# tests|# pass|# fail)' "$RUNNER_TEMP/rm-external-tests.log" | tail -8 | cut -c1-160 || true
            echo "::endgroup::"
            echo "::error::External workspace regression suite failed; detailed logs refeat/rub-minds-uiux-production private."
            exit "$result"
          fi
          echo "External workspace regression suite: PASS"

      - name: TypeScript project build
        id: tsc
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npx tsc -b > "$RUNNER_TEMP/rm-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::TypeScript diagnostic identifiers"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/rm-tsc.log" | sed -E 's/: error TS([0-9]+):.*/: TypeScript diagnostic TS\1/' | tail -20 | cut -c1-220 || true
            echo "::endgroup::"
            echo "::error::TypeScript project build failed; full diagnostics refeat/rub-minds-uiux-production private."
            exit "$result"
          fi
          echo "TypeScript project build: PASS"

      - name: Install Chromium for browser acceptance
        id: playwright
        continue-on-error: true
        working-directory: private-rub-minds
        shell: bash
        run: |
          set +e
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/rm-playwright-install.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Browser test runtime installation failed; private logs are withheld."
            exit "$result"
          fi
          echo "Chromium browser test runtime: PASS"

      - name: Vite production bundle
        id: vite
        continue-on-error: true
        working-directory: private-rub-minds
        env:
          VITE_SUPABASE_URL: https://ui-test.supabase.co
          VITE_SUPABASE_ANON_KEY: ui-test-anon-key-not-for-authentication
        shell: bash
        run: |
          set +e
          npx vite build > "$RUNNER_TEMP/rm-vite.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Vite production bundle failed; private logs are withheld."
            exit "$result"
          fi
          echo "Vite production bundle: PASS"

      - name: Run desktop and mobile browser acceptance
        id: browser
        if: always() && steps.vite.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        working-directory: private-rub-minds
        env:
          RM_BASE_URL: http://127.0.0.1:4173
          RM_SCREENSHOT_DIR: ${{ runner.temp }}/rub-minds-ui-screenshots
          VITE_SUPABASE_URL: https://ui-test.supabase.co
          VITE_SUPABASE_ANON_KEY: ui-test-anon-key-not-for-authentication
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/rm-preview.log" 2>&1 &
          preview_pid=$!
          echo "$preview_pid" > "$RUNNER_TEMP/rm-preview.pid"
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Private UI preview server did not become ready."
            exit 1
          fi
          set +e
          node scripts/ui-redesign.browser-test.mjs > "$RUNNER_TEMP/rm-browser.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Safe browser acceptance failure"
            echo "Exit status: $result; browser log bytes: $(wc -c < "$RUNNER_TEMP/rm-browser.log")"
            grep -iE 'failed|error|exception|timeout|not regular|empty|missing|not found|browser|locator' "$RUNNER_TEMP/rm-browser.log" | head -20 | cut -c1-220 || true
            echo "::endgroup::"
            echo "::error::Desktop/mobile browser acceptance failed; full private logs are withheld."
            exit "$result"
          fi
          grep '^Visual-review screenshots:' "$RUNNER_TEMP/rm-browser.log" | cut -c1-500 || true
          echo "Desktop and mobile Playwright acceptance: PASS"


      - name: Summarize validation stages without exposing private output
        if: always()
        env:
          RUNTIME_RESULT: ${{ steps.runtime.outcome }}
          BACKROOM_RESULT: ${{ steps.backroom.outcome }}
          EXTERNAL_RESULT: ${{ steps.external.outcome }}
          TSC_RESULT: ${{ steps.tsc.outcome }}
          VITE_RESULT: ${{ steps.vite.outcome }}
          PLAYWRIGHT_INSTALL_RESULT: ${{ steps.playwright.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Runtime regressions: $RUNTIME_RESULT"
          echo "Backroom regressions: $BACKROOM_RESULT"
          echo "External workspace regressions: $EXTERNAL_RESULT"
          echo "TypeScript project build: $TSC_RESULT"
          echo "Vite production bundle: $VITE_RESULT"
          echo "Chromium setup: $PLAYWRIGHT_INSTALL_RESULT"
          echo "Desktop/mobile browser acceptance: $BROWSER_RESULT"
          if [ "$RUNTIME_RESULT" != "success" ] || [ "$BACKROOM_RESULT" != "success" ]; then
            echo "Known production-main baseline debt: runtime=$RUNTIME_RESULT, Backroom=$BACKROOM_RESULT (not introduced by this UI-only branch)."
          else
            echo "Runtime and Backroom regression suites: PASS"
          fi
          if [ "$EXTERNAL_RESULT" != "success" ] || [ "$TSC_RESULT" != "success" ] || \
             [ "$VITE_RESULT" != "success" ] || [ "$PLAYWRIGHT_INSTALL_RESULT" != "success" ] || \
             [ "$BROWSER_RESULT" != "success" ]; then
            echo "::error::One or more private production-baseline validation stages failed."
            exit 1
          fi
          echo "Private production UI validation: PASS"

      - name: Verify and archive all visual-review screenshots
        id: visual
        if: always() && steps.browser.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          screenshot_dir="$RUNNER_TEMP/rub-minds-ui-screenshots"
          mapfile -d '' -t screenshots < <(find "$screenshot_dir" -maxdepth 1 -type f -name '*.png' -print0 | sort -z)
          printf 'Regular visual-review PNG files (%s):\n' "${#screenshots[@]}"
          for file in "${screenshots[@]}"; do printf ' - %s\n' "${file##*/}"; done
          echo "Screenshot directory entries (type and name):"
          find "$screenshot_dir" -maxdepth 2 -printf '%y %P\n' | sort
          if [ "${#screenshots[@]}" -ne 9 ]; then
            echo "::error::Expected nine regular visual-review PNG files; found ${#screenshots[@]}."
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/rub-minds-ui-screenshots.tar.gz" -C "$RUNNER_TEMP" rub-minds-ui-screenshots
          echo "Nine screenshots archived for visual review."

      - name: Upload short-lived visual acceptance screenshots
        if: always() && steps.visual.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rub-minds-ui-visual-acceptance
          path: ${{ runner.temp }}/rub-minds-ui-screenshots.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Remove private source and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf private-rub-minds
          rm -f "$RUNNER_TEMP/rm-branch.json" "$RUNNER_TEMP/rm-npm-install.log" "$RUNNER_TEMP/rm-vitest.log" "$RUNNER_TEMP/rm-build.log" "$RUNNER_TEMP/rm-prebuild.log" "$RUNNER_TEMP/rm-tsc.log" "$RUNNER_TEMP/rm-vite.log" "$RUNNER_TEMP/rm-runtime-tests.log" "$RUNNER_TEMP/rm-backroom-tests.log" "$RUNNER_TEMP/rm-external-tests.log" "$RUNNER_TEMP/rm-playwright-install.log" "$RUNNER_TEMP/rm-preview.log" "$RUNNER_TEMP/rm-preview.pid" "$RUNNER_TEMP/rm-browser.log" "$RUNNER_TEMP/rub-minds-ui-screenshots.tar.gz" && rm -rf "$RUNNER_TEMP/rub-minds-ui-screenshots"
          echo "Disposable private-source checkout and logs removed."
